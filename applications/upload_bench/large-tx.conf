# Single-connection ceiling experiment; retain TLS verification and protocol.
# Current SDK caps NET_TCP_MAX_SEND_WINDOW_SIZE at UINT16_MAX (65535).
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=98304
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=65535
# Supply packet/fragment descriptors as well as payload bytes.
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_HEAP_MEM_POOL_SIZE=98304
