# Experimental overlay: use CryptoCell AEAD, retaining the software backend
# for hashes, MACs, ciphers and asymmetric handshake operations.
# The pinned SDK groups GCM and CCM under the same AEAD driver switch.
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_PSA_USE_CC3XX_AEAD_DRIVER=y
CONFIG_PSA_USE_CC3XX_CIPHER_DRIVER=n
CONFIG_PSA_USE_CC3XX_HASH_DRIVER=n
CONFIG_PSA_USE_CC3XX_MAC_DRIVER=n
CONFIG_PSA_USE_CC3XX_KEY_AGREEMENT_DRIVER=n
CONFIG_PSA_USE_CC3XX_ASYMMETRIC_SIGNATURE_DRIVER=n
CONFIG_PSA_USE_CC3XX_ASYMMETRIC_ENCRYPTION_DRIVER=n
CONFIG_PSA_USE_CC3XX_KEY_MANAGEMENT_DRIVER=n
