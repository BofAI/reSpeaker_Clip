# App-only complete recording firmware; no upload-bench sources or 64KiB cache.
CONFIG_CLIP_DTLS_UPLOAD=y
CONFIG_MBEDTLS_SSL_PROTO_DTLS=y
CONFIG_CLIP_DTLS_WINDOW_PACKETS=64
# Keep directional pools modest. The window is logical, not a payload cache.
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=24576
CONFIG_NET_PKT_BUF_RX_DATA_POOL_SIZE=4096
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_HEAP_MEM_POOL_SIZE=73728
# Make room for the measured DTLS call stack without removing product features.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_CLIP_TCP_TRACE=n
CONFIG_CLIP_HTTPS_PROFILE=n
CONFIG_HTTP_CLIENT=n
