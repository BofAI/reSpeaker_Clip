# Temporary station authentication diagnostics. Enable the SD backend only
# during a bounded test with AT+LOG=info; restore AT+LOG=off afterwards.
# Keep connection parameters, retries and timeout settings unchanged.
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_DEBUG_LEVEL=3
CONFIG_WIFI_NM_WPA_SUPPLICANT_DEBUG_SHOW_KEYS=n
CONFIG_CLIP_WIFI_AUTH_LOG=y
