# App-only overlay: do not apply to MCUboot or the network core.
CONFIG_CLIP_HTTPS_POC=y
CONFIG_NRF70_AP_MODE=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=n
CONFIG_NET_DHCPV4_SERVER=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""
CONFIG_NET_TCP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=5000
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# The app's single-owner TLS stream uses these budgets for nonblocking TCP
# and mbedTLS handshake loops; it does not call the SDK's blocking TLS connect.
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=3000
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=10000
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_HTTP_CLIENT=y
CONFIG_JSON_LIBRARY=y
CONFIG_MBEDTLS=y
# TLS uses the existing system heap through tls_allocator.c. Its peak must
# be measured on hardware; do not reserve a second 24 KiB static heap.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
# The generated CA/server certificate uses P-256 ECDSA. Wi-Fi's ECDHE-PSK
# support alone cannot parse/verify it or negotiate certificate-based TLS.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_SSL_SRV_C=n
CONFIG_MBEDTLS_X509_CRL_PARSE_C=n
CONFIG_MBEDTLS_X509_CSR_PARSE_C=n
CONFIG_MBEDTLS_PEM_PARSE_C=y
# CDC-only leaves the SD card owned by the device.
CONFIG_USBD_MSC_CLASS=n

# Boot-time wall clock for certificate validity checks.
CONFIG_SNTP=y
